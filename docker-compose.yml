services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.25-community
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/your_password  # .env와 동일하게
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_data:
  neo4j_data:
